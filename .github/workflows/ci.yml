name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace --release

  distros:
    # Build/test em distros além do Ubuntu (GH não tem runners nativos Fedora/Arch)
    strategy:
      fail-fast: false
      matrix:
        distro:
          - image: fedora:latest
            deps: "dnf install -y -q curl ca-certificates git gcc pkg-config"
          - image: archlinux:latest
            deps: "pacman -Syu --noconfirm --needed curl ca-certificates git gcc pkg-config" # -Syu: -Sy parcial quebra (openssl da imagem vs repos)
    runs-on: ubuntu-latest
    container: ${{ matrix.distro.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências do sistema
        run: ${{ matrix.distro.deps }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # sem Swatinem/rust-cache aqui: containers rodam como root e a chave de
      # cache colidiria com a do ubuntu-latest (mesmo runner.os=Linux)

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler rust-version do workspace
        id: msrv
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "arandu") | .rust_version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV do workspace: $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: check
        run: cargo check --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2

  features:
    # Feature powerset do workspace (com `screenshot-tests` vazia, qualquer
    # combinação deve compilar). `--no-dev-deps` evita compilar wgpu/kittest.
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-hack

      - uses: Swatinem/rust-cache@v2
        with:
          key: features

      - name: cargo hack check
        run: cargo hack check --workspace --feature-powerset --no-dev-deps

  screenshot:
    # Renderização headless via wgpu + lavapipe (Vulkan por software).
    name: Screenshots (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vulkan + lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary
          # Descobre dinamicamente o ICD do lavapipe (nome varia por versão de mesa)
          LVP=$(ls /usr/share/vulkan/icd.d/lvp_icd.*.json 2>/dev/null | head -1)
          test -n "$LVP"
          echo "VK_ICD_FILENAMES=$LVP" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: screenshot

      - name: Rodar snapshots (headless)
        env:
          WGPU_BACKEND: vulkan
          VK_ICD_FILENAMES: ${{ env.VK_ICD_FILENAMES }}
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          cargo test -p arandu-ui --features screenshot-tests --test screenshots -- --test-threads=1

      - name: Subir snapshots em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: crates/ui/tests/snapshots
          if-no-files-found: ignore
