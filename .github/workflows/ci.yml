name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace --release

  distros:
    # Build/test em distros além do Ubuntu (GH não tem runners nativos Fedora/Arch)
    strategy:
      fail-fast: false
      matrix:
        distro:
          - image: fedora:latest
            deps: "dnf install -y -q curl ca-certificates git gcc pkg-config"
          - image: archlinux:latest
            deps: "pacman -Sy --noconfirm --needed curl ca-certificates git gcc pkg-config"
    runs-on: ubuntu-latest
    container: ${{ matrix.distro.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências do sistema
        run: ${{ matrix.distro.deps }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # sem Swatinem/rust-cache aqui: containers rodam como root e a chave de
      # cache colidiria com a do ubuntu-latest (mesmo runner.os=Linux)

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler rust-version do workspace
        id: msrv
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "arandu") | .rust_version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV do workspace: $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: check
        run: cargo check --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
