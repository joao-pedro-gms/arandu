[package]
name = "arandu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Gerenciador de arquivos customizável com integração Git"
readme = "README.md"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
eframe.workspace = true
arandu-config.workspace = true
arandu-ui.workspace = true

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/ui",
    "crates/git",
    "crates/index",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # floor imposta pelo eframe 0.37; política N-2 mantida
license = "MIT OR Apache-2.0"
authors = ["João Pedro Guimarães <joaopedroguimaraes@protonmail.com>"]
repository = "https://github.com/joao-pedro-gms/arandu"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "2"
sha2 = "0.10"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
eframe = "0.37"
# Abre arquivos no app padrão do SO (xdg-open/open/start). MIT, sem deps
# nativas além de libc/is-wsl.
open = "5"
rust-i18n = "4.2"
gix = "0.90"
trash = "5"
# `deflate` (flate2/zlib-rs e zopfli) é puro Rust; bzip2/zstd/aes exigiriam C.
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
# `default-fancy` usa fancy-regex (Rust puro) em vez de onig (C): evita
# cmake/gcc no build e instabilidade no CI do Windows.
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
    "plist-load",
] }
serde_json = "1"
# Renderização de PDF puramente em Rust. `edit`/`forms` ficam de fora: o
# preview só rasteriza, não edita nem preenche formulários.
pdfrum = { version = "0.5", default-features = false, features = [
    "vello-cpu",
    "codecs-all",
    "system-fonts",
] }
# Markdown do painel de preview (feito para egui 0.37).
egui_commonmark = { version = "0.26", default-features = false, features = [
    "pulldown_cmark",
    "regex",
] }

arandu-core = { path = "crates/core" }
arandu-config = { path = "crates/config" }
arandu-ui = { path = "crates/ui" }
arandu-git = { path = "crates/git" }
arandu-index = { path = "crates/index" }

[profile.release]
lto = "thin"
strip = true
