[package]
name = "arandu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Gerenciador de arquivos customizável com integração Git"
readme = "README.md"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
eframe.workspace = true
arandu-config.workspace = true
arandu-ui.workspace = true

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/ui",
    "crates/git",
    "crates/index",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["João Pedro Guimarães <joaopedroguimaraes@protonmail.com>"]
repository = "https://github.com/joao-pedro-gms/arandu"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
eframe = "0.37"
rust-i18n = "4.2"

arandu-core = { path = "crates/core" }
arandu-config = { path = "crates/config" }
arandu-ui = { path = "crates/ui" }
arandu-git = { path = "crates/git" }
arandu-index = { path = "crates/index" }

[profile.release]
lto = "thin"
strip = true
