[package]
name = "arandu-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Interface egui do Arandu"

[dependencies]
eframe.workspace = true
# Habilita o Noto Emoji monoespaçado para os glifos de pasta/arquivo do modo
# ícones (🗀/🗋); sem ele o epaint só carrega Ubuntu + egui-icons.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rust-i18n.workspace = true
arandu-config.workspace = true
arandu-core.workspace = true
arandu-git.workspace = true
syntect.workspace = true
image.workspace = true

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3.27.0"
