[package]
name = "arandu-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Interface egui do Arandu"

[features]
# Habilita os testes de snapshot de tela (exigem um backend wgpu headless).
screenshot-tests = []

[dependencies]
eframe.workspace = true
# Habilita o Noto Emoji monoespaçado para os glifos de pasta/arquivo do modo
# ícones (🗀/🗋); sem ele o epaint só carrega Ubuntu + egui-icons.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rust-i18n.workspace = true
arandu-config.workspace = true
arandu-core.workspace = true
arandu-git.workspace = true
arandu-index.workspace = true
syntect.workspace = true
image.workspace = true
egui_commonmark.workspace = true

[dev-dependencies]
# `wgpu` + `snapshot` são necessários para `Harness::snapshot*`. Dev-deps não
# podem ser opcionais, então o wgpu compila nos jobs de teste mesmo quando a
# feature `screenshot-tests` está desligada (os snapshots só rodam com ela).
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
filetime = "0.2"
tempfile = "3.27.0"

[[test]]
name = "screenshots"
required-features = ["screenshot-tests"]
